name: Auto Update Data

on:
  schedule:
    - cron: '0 0 * * *'  # Runs daily at midnight UTC
  workflow_dispatch:      # Allows manual trigger
  
jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      statuses: write
      checks: write
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scraper/requirements.txt
          
      - name: Calculate current term and run update
        id: check
        run: |
          # Calculate current term
          echo "::group::Calculating academic term"
          CURRENT_TERM=$(date +%Y%m | awk '{y=int(substr($1,1,4)); m=int(substr($1,5,2)); printf("%d%02d", m>=8?y:y-1, m<=4?2:(m>=8?1:3))}')
          echo "Current term: $CURRENT_TERM"
          echo "::endgroup::"
          
          echo "::group::Current terms"
          cat terms.json
          echo "::endgroup::"

          echo "::group::Running scraper"
          echo "Running scraper/scrape.py with term $CURRENT_TERM"
          # Run scraping script with term argument
          python scraper/scrape.py $CURRENT_TERM
          echo "::endgroup::"

          echo "::group::Folding the scrape into terms.json"
          # update_terms.py bumps only this term's version, removes only this term's old
          # data file, and drops the oldest term once the list grows past two.
          python scraper/update_terms.py "$CURRENT_TERM" data.min.json | tee /tmp/update_terms.out
          echo "::endgroup::"

          echo "::group::Result"
          if grep -q '^changed=true$' /tmp/update_terms.out; then
            echo "changes=true" >> $GITHUB_OUTPUT
            echo "version=$(grep '^version=' /tmp/update_terms.out | cut -d= -f2)" >> $GITHUB_OUTPUT
            echo "term=$CURRENT_TERM" >> $GITHUB_OUTPUT
            cat terms.json
          else
            echo "No changes detected in scraped data"
            echo "changes=false" >> $GITHUB_OUTPUT
          fi
          echo "::endgroup::"
          
      - name: Create Pull Request
        if: steps.check.outputs.changes == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update ${{ steps.check.outputs.term }} data to v${{ steps.check.outputs.version }}"
          title: "Data Update: ${{ steps.check.outputs.term }} v${{ steps.check.outputs.version }}"
          body: |
            Automated data update

            - Term: ${{ steps.check.outputs.term }}
            - Updated data file to version ${{ steps.check.outputs.version }}
            - Last updated: ${{ github.event.repository.updated_at }}
            
            This PR was automatically generated by GitHub Actions.
          branch: auto-update-data
          base: master
          delete-branch: true